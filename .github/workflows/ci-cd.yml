name: Portly Multi-Platform CI/CD

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
      - "[0-9]+.*"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  test-rust:
    name: Rust Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies & build dist
        run: |
          pnpm install
          pnpm --filter portly-ui build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Cargo Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace

  build-tauri:
    name: Tauri Build & Release (${{ matrix.platform }})
    needs: test-rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'linux'
            os: ubuntu-22.04
            args: ''
          - platform: 'macos-arm64'
            os: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-x86_64'
            os: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: 'windows'
            os: windows-latest
            args: ''
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-arm64' && 'aarch64-apple-darwin' || matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm --filter portly-ui build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: 'Portly ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format("v{0}", "0.1.0") }}'
          releaseBody: 'See the assets to download Portly for your operating system.'
          releaseDraft: true
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') || false }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: build-tauri
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Publishing release for tag: $TAG_NAME"
          if [[ "$TAG_NAME" == *-* ]]; then
            echo "Publishing as pre-release"
            gh release edit "$TAG_NAME" --draft=false --prerelease
          else
            echo "Publishing as latest stable release"
            gh release edit "$TAG_NAME" --draft=false --latest
          fi
